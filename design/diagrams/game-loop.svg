<svg width="1180" height="520" viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D8DCE8" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="520" fill="#0E1016" />

  <text x="590" y="30" text-anchor="middle" fill="#D8DCE8" font-size="22" font-weight="600">Trust No Wall: Game Loop</text>

  <!-- Title -->
  <rect x="40" y="80" width="180" height="90" rx="14" fill="#1A1D27" stroke="#4DE1FF" stroke-width="2" />
  <text x="130" y="118" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Title</text>
  <text x="130" y="140" text-anchor="middle" fill="#9AA0B4" font-size="12">TRUST NO WALL</text>
  <text x="130" y="156" text-anchor="middle" fill="#9AA0B4" font-size="12">Press SPACE to start</text>

  <!-- Level Intro -->
  <rect x="300" y="80" width="200" height="90" rx="14" fill="#1A1D27" stroke="#B084F5" stroke-width="2" />
  <text x="400" y="118" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Level Intro</text>
  <text x="400" y="140" text-anchor="middle" fill="#9AA0B4" font-size="12">"NEW: &lt;mechanic&gt;" card</text>
  <text x="400" y="156" text-anchor="middle" fill="#9AA0B4" font-size="12">up to 4s, Space/Enter skips</text>

  <!-- Playing -->
  <rect x="600" y="80" width="180" height="90" rx="14" fill="#1A1D27" stroke="#3DDC84" stroke-width="2" />
  <text x="690" y="118" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Playing</text>
  <text x="690" y="140" text-anchor="middle" fill="#9AA0B4" font-size="12">HUD: level, N x N,</text>
  <text x="690" y="156" text-anchor="middle" fill="#9AA0B4" font-size="12">deaths, run time</text>

  <!-- Level Complete -->
  <rect x="900" y="80" width="220" height="90" rx="14" fill="#1A1D27" stroke="#FFC857" stroke-width="2" />
  <text x="1010" y="118" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Level Complete</text>
  <text x="1010" y="140" text-anchor="middle" fill="#9AA0B4" font-size="12">Destination reached, burst</text>
  <text x="1010" y="156" text-anchor="middle" fill="#9AA0B4" font-size="12">"LEVEL L COMPLETE" 1.5s</text>

  <!-- Dying -->
  <rect x="600" y="320" width="180" height="90" rx="14" fill="#1A1D27" stroke="#FF4D5E" stroke-width="2" />
  <text x="690" y="358" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Dying</text>
  <text x="690" y="380" text-anchor="middle" fill="#9AA0B4" font-size="12">cause shown, shrink,</text>
  <text x="690" y="396" text-anchor="middle" fill="#9AA0B4" font-size="12">shake, 0.9s</text>

  <!-- Next Level -->
  <rect x="900" y="320" width="220" height="90" rx="14" fill="#1A1D27" stroke="#FF8C42" stroke-width="2" />
  <text x="1010" y="358" text-anchor="middle" fill="#D8DCE8" font-size="18" font-weight="600">Next Level (L+1)</text>
  <text x="1010" y="380" text-anchor="middle" fill="#9AA0B4" font-size="12">N = L+3, same run seed</text>
  <text x="1010" y="396" text-anchor="middle" fill="#9AA0B4" font-size="12">new layout generated</text>

  <!-- Title -> Level Intro (a level that introduces a mechanic) -->
  <line x1="220" y1="125" x2="292" y2="125" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Title -> Playing directly (level 1: no mechanic to introduce) -->
  <path d="M 130 80 L 130 62 L 690 62 L 690 72" fill="none" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="410" y="56" text-anchor="middle" fill="#9AA0B4" font-size="11">level 1: straight to Playing (no mechanic to introduce)</text>

  <!-- Level Intro -> Playing -->
  <line x1="500" y1="125" x2="592" y2="125" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Playing -> Level Complete -->
  <line x1="780" y1="125" x2="892" y2="125" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="836" y="112" text-anchor="middle" fill="#9AA0B4" font-size="11">reach Destination</text>

  <!-- Playing -> Dying -->
  <line x1="650" y1="170" x2="650" y2="312" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="628" y="245" text-anchor="end" fill="#9AA0B4" font-size="11">player dies</text>

  <!-- Dying -> Playing (restart, same layout) -->
  <line x1="730" y1="312" x2="730" y2="170" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="752" y="238" text-anchor="start" fill="#9AA0B4" font-size="11">restart attempt,</text>
  <text x="752" y="252" text-anchor="start" fill="#9AA0B4" font-size="11">same layout</text>

  <!-- Level Complete -> Next Level -->
  <line x1="1010" y1="170" x2="1010" y2="312" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Next Level -> Level Intro (loop) -->
  <path d="M 1010 410 L 1010 455 L 400 455 L 400 178" fill="none" stroke="#D8DCE8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="705" y="476" text-anchor="middle" fill="#9AA0B4" font-size="11">begins with its own intro card if it introduces a new mechanic</text>

  <text x="590" y="500" text-anchor="middle" fill="#5C6178" font-size="11">R restarts the current attempt at any time; P/Esc pauses; M mutes</text>
</svg>
